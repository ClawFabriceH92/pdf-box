# Catalogue de versions : une seule source de vérité pour les dépendances,
# lisible par Dependabot et par les humains.
[versions]
agp = "8.7.3"
kotlin = "2.1.0"
activityCompose = "1.9.3"
coreKtx = "1.15.0"
composeBom = "2024.12.01"
coroutines = "1.9.0"
lifecycle = "2.8.7"
documentfile = "1.0.1"
exifinterface = "1.3.7"
pdfboxAndroid = "2.0.27.0"
mlkitText = "16.0.1"
junit = "4.13.2"

[libraries]
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-documentfile = { module = "androidx.documentfile:documentfile", version.ref = "documentfile" }
androidx-exifinterface = { module = "androidx.exifinterface:exifinterface", version.ref = "exifinterface" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }

compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-material-icons-core = { module = "androidx.compose.material:material-icons-core" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }

kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }

# PDFBox-Android (portage Android d'Apache PDFBox 2.0) : lecture/écriture de la
# structure du PDF. La version amont `org.apache.pdfbox:pdfbox` dépend de
# java.awt/ImageIO, absents d'Android — ce portage est la seule voie viable.
pdfbox-android = { module = "com.tom-roush:pdfbox-android", version.ref = "pdfboxAndroid" }

# ML Kit « bundled » : le modèle est dans l'APK, aucun téléchargement, aucun réseau.
mlkit-text-recognition = { module = "com.google.mlkit:text-recognition", version.ref = "mlkitText" }

junit = { module = "junit:junit", version.ref = "junit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
